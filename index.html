    }

    #ccfw .ccfw-choice span { display: block; color: var(--ccfw-muted); font-size: .95rem; margin-top: .15rem; }
    /* Hover / keyboard focus / press: fill the whole option with the primary color */

      background: var(--ccfw-primary); border-color: var(--ccfw-primary-dark);

    }
    #ccfw .ccfw-choice:hover strong, #ccfw .ccfw-choice:focus-visible strong, #ccfw .ccfw-choice:active strong { color: #fff; }
    #ccfw .ccfw-choice:hover span, #ccfw .ccfw-choice:focus-visible span, #ccfw .ccfw-choice:active span { color: #e3edf5; }

    #ccfw .ccfw-big .ccfw-choice strong { font-size: 1.2rem; }

      background: #fff; color: var(--ccfw-primary); border: 1px solid var(--ccfw-primary);
      padding: .45rem .85rem; font-size: .95rem;
    }
    #ccfw .ccfw-secondary:hover { background: var(--ccfw-primary); color: #fff; }
    #ccfw .ccfw-primary {
      background: var(--ccfw-primary); color: #fff; border: 2px solid var(--ccfw-primary);
      padding: .75rem 1.4rem; font-size: 1.05rem; font-weight: 600;
    }
    #ccfw .ccfw-primary:hover { background: var(--ccfw-primary-dark); }
    #ccfw button:focus-visible, #ccfw a:focus-visible, #ccfw input:focus-visible + label, #ccfw summary:focus-visible {
      outline: 3px solid var(--ccfw-focus); outline-offset: 2px; box-shadow: 0 0 0 5px var(--ccfw-primary-dark);
    }
    #ccfw fieldset { border: 0; padding: 0; margin: 1.25rem 0 0; }
    #ccfw legend { font-weight: 600; margin-bottom: .5rem; padding: 0; }
    #ccfw .ccfw-check { display: flex; gap: .7rem; align-items: flex-start; padding: .7rem .85rem; border: 1px solid var(--ccfw-border); border-radius: 8px; margin-bottom: .5rem; background:#fff; }
    #ccfw .ccfw-check input { width: 1.35rem; height: 1.35rem; margin: .15rem 0 0; flex: 0 0 auto; accent-color: var(--ccfw-primary); }
    #ccfw .ccfw-check label { cursor: pointer; }
    #ccfw .ccfw-check label span { display: block; color: var(--ccfw-muted); font-size: .95rem; }
    #ccfw .ccfw-check { border-width: 2px; }
    #ccfw .ccfw-check:hover { background: #dce9f3; border-color: var(--ccfw-primary); }
    #ccfw .ccfw-check.is-checked { background: #cfe1ef; border-color: var(--ccfw-primary-dark); box-shadow: inset 6px 0 0 var(--ccfw-primary); }
    #ccfw .ccfw-check.is-checked label { font-weight: 600; }
    #ccfw .ccfw-check.is-checked label span { font-weight: 400; color: #33404b; }
    #ccfw .ccfw-check:focus-within { border-color: var(--ccfw-primary); box-shadow: 0 0 0 3px var(--ccfw-focus); }
    #ccfw .ccfw-check.is-checked:focus-within { box-shadow: inset 6px 0 0 var(--ccfw-primary), 0 0 0 3px var(--ccfw-focus); }
    #ccfw .ccfw-error { color: var(--ccfw-no-tx); font-weight: 600; margin-top: .5rem; }
    #ccfw details { background: var(--ccfw-accent); border: 1px solid var(--ccfw-border); border-radius: 8px; padding: .6rem 1rem; margin: 1rem 0 0; }
    #ccfw summary { cursor: pointer; font-weight: 600; color: var(--ccfw-primary-dark); }
    #ccfw details[open] summary { margin-bottom: .6rem; }
    #ccfw .ccfw-cols { columns: 2; column-gap: 2rem; }
    #ccfw .ccfw-cols li { break-inside: avoid; }
    #ccfw .ccfw-answer { border: 3px solid; border-radius: 12px; padding: 1.25rem 1.5rem 1.4rem; margin: 0 0 1.5rem; }
    #ccfw .ccfw-answer-label { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 .6rem; color: inherit; }
    #ccfw .ccfw-answer .ccfw-badge { font-size: 1.15rem; padding: .4rem 1rem; background: #fff; }
    #ccfw .ccfw-answer h3 { font-size: 1.75rem; margin: 0; color: var(--ccfw-text); }
    #ccfw .ccfw-details-head { font-size: 1.15rem; margin: 0 0 .75rem; color: var(--ccfw-primary-dark); }
    #ccfw .ccfw-badge { display: inline-flex; align-items: center; gap: .45rem; font-weight: 700; padding: .3rem .75rem; border-radius: 999px; border: 2px solid; font-size: .95rem; margin-bottom: .75rem; }
    #ccfw .ccfw-result { border-left: 6px solid; border-radius: 8px; padding: 1rem 1.15rem; margin: 0 0 1rem; }
    #ccfw .ok   { background: var(--ccfw-ok-bg);   border-color: var(--ccfw-ok-bd);   color: var(--ccfw-ok-tx); }
    #ccfw .lic  { background: var(--ccfw-lic-bg);  border-color: var(--ccfw-lic-bd);  color: var(--ccfw-lic-tx); }
    #ccfw .no   { background: var(--ccfw-no-bg);   border-color: var(--ccfw-no-bd);   color: var(--ccfw-no-tx); }
    #ccfw .info { background: var(--ccfw-info-bg); border-color: var(--ccfw-info-bd); color: var(--ccfw-info-tx); }
    #ccfw .ccfw-result p, #ccfw .ccfw-result li { color: var(--ccfw-text); }
    #ccfw .ccfw-result h4 { margin-top: 0; color: inherit; }
    #ccfw .ccfw-contact { background: var(--ccfw-accent); border: 1px solid var(--ccfw-border); border-radius: 8px; padding: 1rem 1.15rem; margin-top: 1.25rem; }
    #ccfw .ccfw-contact p { margin: 0 0 .3rem; }
    #ccfw .ccfw-cite { font-size: .88rem; color: var(--ccfw-muted); margin-top: .5rem; }
    #ccfw .ccfw-answers { font-size: .95rem; }
    #ccfw .ccfw-answers dt { font-weight: 600; margin-top: .5rem; }
    #ccfw .ccfw-answers dd { margin: 0 0 0 1rem; }
    #ccfw .ccfw-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }

    @media (prefers-reduced-motion: reduce) { #ccfw * { transition: none !important; } }
    @media print {
      #ccfw .ccfw-toolbar, #ccfw .ccfw-actions, #ccfw .ccfw-noprint { display: none !important; }

      #ccfw details { display: block; }
      #ccfw details > *:not(summary) { display: block !important; }

    }

  <div class="ccfw-card">
    <h2 class="ccfw-title">Food License Check</h2>
    <p class="ccfw-subtitle">Answer a few questions to find out which food license, if any, you may need in Clinton County.</p>
    <div class="ccfw-toolbar ccfw-noprint">
      <p class="ccfw-progress" id="ccfw-progress" aria-live="polite"></p>
      <div class="ccfw-nav">
        <button type="button" class="ccfw-secondary" id="ccfw-back">&larr; Previous question</button>
        <button type="button" class="ccfw-secondary" id="ccfw-restart">Start over</button>
      </div>
    </div>
    <div id="ccfw-body"></div>
  </div>

  <noscript><p>This tool needs JavaScript. Please call the Clinton County Health District at (937) 382-3829 for help finding out whether you need a food license.</p></noscript>

  <script>
  (function () {
    "use strict";

    /* ---------------------------------------------------------------
       CONFIG: edit these values. Leave a URL blank ("") to hide that link.
       --------------------------------------------------------------- */
    var CONFIG = {
      agency: "Clinton County Health District",
      program: "Environmental Health – Food Safety Program",
      phone: "(937) 382-3829",
      email: "info@clincohd.com",
      address: "111 S. Nelson Ave., Wilmington, OH 45177",
      hours: "Monday–Friday",
      foodPageUrl: "",           // PLACEHOLDER: food safety program page, e.g. "/food-safety"
      applicationsUrl: "",       // PLACEHOLDER: license applications page
      feeScheduleUrl: "",        // PLACEHOLDER: food license fee schedule
      tempNoticeDays: "5",       // days of notice required for temporary licenses
      lastReviewed: "November 2026"
    };

    var LINKS = {
      odaFood: "https://agri.ohio.gov/divisions/food-safety",
      homeBakery: "https://agri.ohio.gov/divisions/food-safety/licenses/Home-Bakery-Registration",
      farmMarket: "https://agri.ohio.gov/divisions/food-safety/forms/farm-market-registration-form",
      gateway: "https://business.ohio.gov",
      orc371701: "https://codes.ohio.gov/ohio-revised-code/section-3717.01",
      orc371722: "https://codes.ohio.gov/ohio-revised-code/section-3717.22",
      orc371742: "https://codes.ohio.gov/ohio-revised-code/section-3717.42",
      oacCottage: "https://codes.ohio.gov/ohio-administrative-code/chapter-901:3-20",
      findLHD: "https://odh.ohio.gov/find-local-health-districts"
    };
    var ODA = "Ohio Department of Agriculture (ODA), Division of Food Safety: (614) 728-6250, foodsafety@agri.ohio.gov";

    /* ---------------------------------------------------------------
       Helpers
       --------------------------------------------------------------- */
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function a(href, text) { return '<a href="' + href + '" target="_blank" rel="noopener">' + text + '<span class="ccfw-sr"> (opens in a new tab)</span></a>'; }
    function ul(items) { return "<ul>" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>"; }
    function cite(t) { return '<p class="ccfw-cite">Based on: ' + t + "</p>"; }
    function box(tone, title, html) { return '<div class="ccfw-result ' + tone + '"><h4>' + title + "</h4>" + html + "</div>"; }
    var BADGE = {
      ok:   ["ok",   "&#10003;", "No food license needed"],
      lic:  ["lic",  "!",        "A license is likely needed"],
      no:   ["no",   "&#10007;", "Not allowed as described"],
      info: ["info", "i",        "Let’s talk"]
    };
    function tempTiming() {
      return CONFIG.tempNoticeDays ? "Apply at least " + esc(CONFIG.tempNoticeDays) + " days before the event." : "Apply well before the event. Contact us for deadlines.";
    }

    var COTTAGE_LIST = [
      "Baked goods that don’t need refrigeration (cookies, breads, brownies, fruit pies, cakes with shelf-stable icing)",
      "Jams and jellies (made with sugar; not freezer jam or sugar-free)",
      "Fruit butters and fruit chutneys",
      "Candy (but <em>not</em> fresh fruit dipped in or covered with candy)",
      "Flavored honey (from an exempt Ohio beekeeper)",
      "Maple sugar (from an exempt Ohio maple syrup producer)",
      "Granola, granola bars, candy-dipped granola bars (dried fruit must be commercially dried)",
      "Popcorn, flavored popcorn, kettle corn, popcorn balls, caramel corn",
      "Unfilled baked donuts",
      "Waffle cones (including candy-dipped) and pizzelles",
      "Dry cereal and nut snack mixes with seasonings",
      "Roasted coffee (whole bean or ground)",
      "Dry baking mixes in a jar (like cookie mix)",
      "Dry herbs, herb blends, and dry seasoning blends",
      "Dry soup mixes (with commercially dried vegetables, beans, grains)",
      "Dry tea blends"
    ];
    var NOT_COTTAGE = [
      "Cheesecake; cream, custard, pumpkin, sweet potato, or meringue pies; cream-filled pastries or donuts (home bakery license may work)",
      "Salsa, sauces, pickles, relishes, canned vegetables, or anything in a pressure canner",
      "Freezer jam, sugar-free jams and jellies",
      "Candy apples or other candy-covered fresh fruit",
      "Home-dried or freeze-dried fruits, vegetables, or meats; jerky",
      "Meals, sandwiches, meat, dairy, or eggs",
      "Beverages, kombucha, cold brew",
      "Anything vacuum-sealed (reduced oxygen packaging)"
    ];

    function contactBlock() {
      var h = '<div class="ccfw-contact"><p><strong>' + esc(CONFIG.agency) + "</strong><br>" + esc(CONFIG.program) + "</p>" +
        "<p>Phone: " + esc(CONFIG.phone) + " &nbsp;|&nbsp; Email: <a href=\"mailto:" + esc(CONFIG.email) + "\">" + esc(CONFIG.email) + "</a></p>" +
        "<p>" + esc(CONFIG.address) + "</p>";
      if (CONFIG.foodPageUrl) h += '<p><a href="' + CONFIG.foodPageUrl + '">Food safety program page</a></p>';
      if (CONFIG.applicationsUrl) h += '<p><a href="' + CONFIG.applicationsUrl + '">License applications and forms</a></p>';
      if (CONFIG.feeScheduleUrl) h += '<p><a href="' + CONFIG.feeScheduleUrl + '">Food license fee schedule</a></p>';
      return h + "</div>";
    }

    function otherAgencies() {
      return "<details><summary>Other things a new food business may need (not from the health district)</summary>" + ul([
        "<strong>Vendor’s license</strong> from the Ohio Department of Taxation if you sell taxable items. Start at " + a(LINKS.gateway, "Ohio Business Gateway") + ".",
        "<strong>Business registration</strong> with the Ohio Secretary of State if you form an LLC or corporation or use a trade name.",
        "<strong>Zoning approval</strong> from your city, village, or township, including for home-based businesses.",
        "<strong>Building, plumbing, and fire</strong> permits for construction or remodeling.",
        "<strong>Liquor permit</strong> from the Ohio Division of Liquor Control if you sell alcohol.",
        "<strong>Private well or septic system</strong>: a business on a private well or septic system may need water testing or a sewage system review. Ask us.",
        "<strong>Food safety training</strong>: many licensed operations need staff with Ohio Person in Charge or Manager certification. We offer classes."
      ]) + "</details>";
    }

    /* ---------------------------------------------------------------
       Question & result tree
       Each node: { q, help, more, choices:[{label, desc, go, set}] }
       or multi:  { q, help, multi:[{id,label,desc}], go }
       or result: { result: function(state) -> {badge, title, html} }
       --------------------------------------------------------------- */
    var N = {};

    N.start = {
      big: true,
      q: "Do you plan to sell food in Clinton County?",
      help: "“Selling” includes charging admission or a ticket price that includes food, or requiring a donation to get food.",
      more: "<p>This tool covers food businesses and events in Clinton County, Ohio. Selling somewhere else in Ohio? Contact that county’s health district: " + a(LINKS.findLHD, "Find your local health district") + ".</p>",
      choices: [
        { label: "Yes, I plan to sell food", desc: "Including at events, from home, online, or through a business", go: "type" },
        { label: "No, I plan to only give food away", desc: "Free food, with no charge or required donation", go: "R_giveaway" }
      ]
    };

    N.type = {
      q: "Which of these best describes what you want to do?",
      help: "Pick the closest match. You can go back and change your answer.",
      choices: [
        { label: "Make food in my home kitchen to sell", desc: "Baked goods, candy, jams, snacks, home-cooked meals", go: "home_list" },
        { label: "Sell food at a one-time event", desc: "A fair, festival, concert, craft show, or other event lasting 5 days or less", go: "event_org" },
        { label: "Run a food truck, trailer, cart, or mobile stand", desc: "A business that moves to different locations", go: "mobile_hq" },
        { label: "Open a restaurant, café, bar, or catering business", desc: "Serving ready-to-eat food or drinks", go: "fso_exempt" },
        { label: "Open a store or market", desc: "Grocery, convenience store, meat market, bakery counter, or similar", go: "rfe_exempt" },
        { label: "Sell products from my farm", desc: "Produce, eggs, meat, poultry, honey, maple syrup", go: "farm_products" },
        { label: "Raise money for a church, school, or nonprofit", desc: "Fundraisers, dinners, bake sales, concession stands", go: "np_type" },
        { label: "Place food vending machines", desc: "", go: "vend_what" },
        { label: "Make packaged food to sell wholesale to stores", desc: "Sauces, salsa, canned goods, beverages, and other packaged foods", go: "R_wholesale" },
        { label: "Something else / I’m not sure", desc: "", go: "R_unsure" }
      ]
    };

    /* ---------- HOME KITCHEN ---------- */
    N.home_list = {
      q: "Is everything you plan to make on Ohio’s cottage food list?",
      help: "Ohio lets people make certain lower-risk foods in their home kitchen with no license. These are called cottage foods.",
      moreOpen: true,
      moreTitle: "See the cottage food list",
      more: "<h4>Allowed cottage foods</h4><ul class=\"ccfw-cols\">" + COTTAGE_LIST.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>" +
            "<h4>Not cottage foods (examples)</h4>" + ul(NOT_COTTAGE) +
            cite(a("https://law.cornell.edu/regulations/ohio/Ohio-Admin-Code-901-3-20-04", "OAC 901:3-20-04") + " (approved list); " + a(LINKS.oacCottage, "OAC 901:3-20-05") + " (prohibitions)"),
      choices: [
        { label: "Yes, everything is on the list", go: "home_def", set: { home: "cottage" } },
        { label: "No, or some items are not on the list", go: "home_bakery_q" }
      ]
    };

    N.home_bakery_q = {
      q: "Are the items that aren’t on the list baked goods that need refrigeration?",
      help: "Examples: cheesecake; cream, custard, pumpkin, or meringue pies; cream-filled pastries.",
      more: "<p>Ohio’s <strong>home bakery</strong> registration (from the Ohio Department of Agriculture) lets you bake these items at home after a kitchen inspection. A home bakery can also make everything on the cottage food list.</p>",
      choices: [
        { label: "Yes, they’re baked goods that need refrigeration", go: "home_def", set: { home: "bakery" } },
        { label: "No, I want to make other foods", desc: "Meals, salsa, canned goods, sauces, jerky, freeze-dried foods, etc.", go: "home_meals" }
      ]
    };

    N.home_def = {
      q: "Will you make the food in the home you own and live in?",
      help: "Ohio law defines “home” for cottage foods and home bakeries narrowly.",
      moreOpen: true,
      moreTitle: "What counts as a “home”",
      more: ul([
        "It is your <strong>primary residence</strong>, and it is <strong>occupied by its owner</strong>.",
        "The kitchen has <strong>only one stove or oven</strong> (a double oven is OK) of ordinary residential design, not commercial equipment.",
        "The food is made in the home’s ordinary kitchen."
      ]) + "<p class=\"ccfw-hint\">Renting, or using a second kitchen? Call ODA before you start.</p>" +
        cite(a("https://codes.ohio.gov/ohio-revised-code/section-3715.01", "ORC 3715.01(A)(17)") + "; ORC 911.02"),
      choices: [
        { label: "Yes, that describes my home kitchen", go: function (s) { return s.home === "bakery" ? "bakery_where" : "cottage_where"; } },
        { label: "No / not sure", go: "R_home_not_qualify" }
      ]
    };

        if (node.help) h += '<p class="ccfw-hint">' + node.help + "</p>";
        if (node.more) h += "<details" + (node.moreOpen ? "" : "") + "><summary>" + (node.moreTitle || "More information") + "</summary>" + node.more + "</details>";

        if (node.choices) {
          h += '<ul class="ccfw-choices' + (node.big ? " ccfw-big" : "") + '" aria-labelledby="ccfw-q">';
          node.choices.forEach(function (c, i) {
            h += '<li><button type="button" class="ccfw-choice" data-i="' + i + '"><strong>' + c.label + "</strong>" + (c.desc ? "<span>" + c.desc + "</span>" : "") + "</button></li>";
          });
          h += "</ul>";
          body.innerHTML = h;
          Array.prototype.forEach.call(body.querySelectorAll(".ccfw-choice"), function (btn) {
            btn.onclick = function () { var c = node.choices[+btn.getAttribute("data-i")]; go(c.go, c.label.replace(/<[^>]+>/g, ""), c.set); };
          });
        } else if (node.multi) {
          var key = "multi_" + current, prev = state[key] || [];
          h += '<fieldset><legend class="ccfw-sr">' + node.q + "</legend>";
          node.multi.forEach(function (m) {
            var id = "ccfw-" + current + "-" + m.id;
            h += '<div class="ccfw-check"><input type="checkbox" id="' + id + '" value="' + m.id + '"' + (prev.indexOf(m.id) > -1 ? " checked" : "") + '><label for="' + id + '">' + m.label + (m.desc ? "<span>" + m.desc + "</span>" : "") + "</label></div>";
          });
          h += '</fieldset><p class="ccfw-error" id="ccfw-err" role="alert"></p><button type="button" class="ccfw-primary" id="ccfw-next">Continue</button>';
          body.innerHTML = h;
          Array.prototype.forEach.call(body.querySelectorAll(".ccfw-check"), function (row) {
            var cb = row.querySelector("input");
            var sync = function () { row.classList.toggle("is-checked", cb.checked); };
            sync(); cb.addEventListener("change", sync);
            row.addEventListener("click", function (e) { if (e.target === row) { cb.checked = !cb.checked; sync(); } });
            row.style.cursor = "pointer";
          });
          document.getElementById("ccfw-next").onclick = function () {
            var sel = Array.prototype.map.call(body.querySelectorAll("input:checked"), function (x) { return x.value; });
            if (!sel.length) { document.getElementById("ccfw-err").textContent = "Please check at least one option."; return; }
            var labels = node.multi.filter(function (m) { return sel.indexOf(m.id) > -1; }).map(function (m) { return m.label; }).join("; ");
            var o = {}; o[key] = sel;
            go(node.go, labels, o);
          };
        }
      }
      if (focus) {
        var hd = body.querySelector("h3");
        if (hd) {
          hd.focus({ preventScroll: true });
          if (IN_FRAME) { postToParent({ type: "ccfw-step" }); }
          else { var top = document.getElementById("ccfw").getBoundingClientRect().top; if (top < 0) document.getElementById("ccfw").scrollIntoView({ behavior: "smooth", block: "start" }); }
        }
      }
    }

    /* open the details flagged moreOpen */
    var _render = render;
    render = function (f) { _render(f); var n = N[current]; if (n && n.moreOpen) { var d = body.querySelector("details"); if (d) d.open = true; } };

    /* ---------------------------------------------------------------
       iframe support: report height to the host page so the frame grows
       to fit (no inner scrollbar). Only a number is sent, nothing personal.
       --------------------------------------------------------------- */
    var IN_FRAME = window.self !== window.top;
    function postToParent(msg) { try { window.parent.postMessage(msg, "*"); } catch (e) {} }
    function reportHeight() {
      if (!IN_FRAME) return;
      postToParent({ type: "ccfw-height", height: Math.ceil(document.documentElement.getBoundingClientRect().height) });
    }
    if (IN_FRAME) {
      if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
      window.addEventListener("load", reportHeight);
      document.addEventListener("toggle", reportHeight, true);   /* <details> open/close */
      setInterval(reportHeight, 1000);                           /* safety net for older browsers */
    }

    /* Optional size override from the address, e.g. index.html?size=0.8 (allowed range 0.6–1.2) */
    (function () {
      var m = /[?&]size=([0-9.]+)/.exec(location.search);
      var v = m ? parseFloat(m[1]) : NaN;
      if (v >= 0.6 && v <= 1.2) document.getElementById("ccfw").style.setProperty("--ccfw-size", String(v));
    })();

    backBtn.onclick = back;
    restartBtn.onclick = restart;
    render(false);
  })();
  </script>
</div>

</body>
</html>
